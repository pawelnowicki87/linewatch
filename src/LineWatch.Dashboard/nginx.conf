server {
    listen 80;
    root /usr/share/nginx/html;

    types {
        application/wasm wasm;
    }

    location / {
        # Deep links like /machines/mill-1 are client-side routes.
        try_files $uri $uri/ /index.html;
    }

    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
