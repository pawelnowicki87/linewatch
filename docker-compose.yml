services:
  postgres:
    image: postgres:17
    container_name: linewatch-postgres
    environment:
      POSTGRES_USER: linewatch
      POSTGRES_PASSWORD: linewatch
      POSTGRES_DB: linewatch
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
