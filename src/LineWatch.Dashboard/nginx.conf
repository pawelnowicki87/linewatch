server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx's default mime.types already maps .wasm to application/wasm.
    # A types block here would replace that whole table, not add to it.

    location / {
        # Deep links like /machines/mill-1 are client-side routes.
        try_files $uri $uri/ /index.html;
    }

    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
